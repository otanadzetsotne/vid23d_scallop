[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vid23d"
version = "2.0.0"
description = "2D to 3D (SBS) video converter using MiDaS/ZoeDepth and RAFT"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tsotne Otanadze", email = "otanadzetsotne@gmail.com" }]
keywords = ["video", "stereo", "3d", "depth", "midas", "raft"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Multimedia :: Video :: Conversion", 
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11", 
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "absl-py",
  "einops~=0.8.1",
  "imageio~=2.37.0",
  "imageio-ffmpeg~=0.6.0",
  "matplotlib~=3.10.0",
  "numpy~=2.0.2",
  "opencv-python~=4.12.0.88",
  "timm~=1.0.19",
  # Torch/torchvision vary by platform; install separately as per README
  "torch",
  "torchvision",
  "tqdm~=4.67.1",
]

[project.urls]
Homepage = "https://github.com/otanadzetsotne/vid23d_scallop"
Repository = "https://github.com/otanadzetsotne/vid23d_scallop"
Issues = "https://github.com/otanadzetsotne/vid23d_scallop/issues"

[project.scripts]
vid23d = "vid23d.cli:main"
vid23d-test = "vid23d.tests_runner:main"

[project.optional-dependencies]
test = ["pytest>=8.0.0"]
gpu = ["torch", "torchvision"]
cpu = ["torch", "torchvision"]

[tool.setuptools]
packages = ["vid23d"]
include-package-data = true
